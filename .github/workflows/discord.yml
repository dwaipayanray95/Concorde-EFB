name: Discord

# One master Discord webhook (DISCORD_WEBHOOK_URL secret) for everything
# that happens on GitHub. Runs automatically; nothing to trigger by hand.
#
#  - push to main ............ one slim card: subject + one-line excerpt per
#                              commit, footer with app version / branch
#  - release published ....... full release -> big amber card (changelog bullets,
#                              downloads, screenshot); beta -> blue card
#
# Commits and betas are sent with Discord's @silent flag (4096): they appear
# in the channel but don't ping anyone. Full releases notify normally.
#
# Full releases from build.yml are created as drafts when "draft" is ticked;
# they only post once someone clicks Publish on GitHub.
#
# If the secret isn't set, every job skips quietly.
on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  commits:
    name: Post pushed commits
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout card template and version
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pubspec.yaml
            .github/discord
          sparse-checkout-cone-mode: false

      - name: Post commits
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          COMPARE_URL: ${{ github.event.compare }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi
          if [ "$(jq 'length' <<<"$COMMITS")" -eq 0 ]; then
            echo "No commits in this push; nothing to post."
            exit 0
          fi
          # Card layout lives in .github/discord/commits.jq.
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          payload=$(jq -n \
            --argjson commits "$COMMITS" \
            --arg branch "$BRANCH" \
            --arg compare "$COMPARE_URL" \
            --arg version "$version" \
            -f .github/discord/commits.jq)
          curl -sS -f -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"

  release:
    name: Announce release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout card template and changelog
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/changelog/entries.json
            .github/discord
          sparse-checkout-cone-mode: false

      - name: Post release announcement
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE: ${{ toJSON(github.event.release) }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi
          # Card layout lives in .github/discord/release.jq.
          payload=$(jq -n \
            --argjson rel "$RELEASE" \
            --argjson entries "$(cat public/changelog/entries.json)" \
            --arg site "https://dwaipayanray95.github.io/Concorde-EFB" \
            -f .github/discord/release.jq)
          curl -sS -f -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"
