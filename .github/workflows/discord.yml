name: Discord

# One master Discord webhook (DISCORD_WEBHOOK_URL secret) for everything
# that happens on GitHub. Runs automatically; nothing to trigger by hand.
#
#  - push to main ............ the new commits (short SHA, subject, author)
#  - release published ....... beta pre-release  -> "New beta build" + downloads page
#                              full release      -> "Concorde EFB vX released" + notes
#
# Full releases from build.yml are created as drafts when "draft" is ticked;
# they only post once someone clicks Publish on GitHub.
#
# If the secret isn't set, every job skips quietly.
on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  commits:
    name: Post pushed commits
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Post commits
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE_URL: ${{ github.event.compare }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi

          total=$(jq 'length' <<<"$COMMITS")
          if [ "$total" -eq 0 ]; then
            echo "No commits in this push; nothing to post."
            exit 0
          fi

          # One embed per commit (Discord allows up to 10 per message):
          # author with GitHub avatar, full subject as the title, the body
          # text (without bot trailers), short SHA and branch in the footer.
          more=$(( total > 10 ? total - 10 : 0 ))
          header="⬆️ **$total new commit$([ "$total" -eq 1 ] || echo s)** pushed to \`$BRANCH\` by **$PUSHER** · [Compare changes]($COMPARE_URL)"
          if [ "$more" -gt 0 ]; then
            header="$header"$'\n'"…and $more more not shown, see the compare link."
          fi

          payload=$(jq -n \
            --arg header "$header" \
            --arg branch "$BRANCH" \
            --argjson commits "$COMMITS" \
            '{
              content: $header,
              embeds: [ $commits[:10][] |
                (.message | split("\n")) as $lines
                | ($lines[1:]
                    | map(select(test("^(Co-Authored-By|Claude-Session|Signed-off-by):\\s") | not))
                    | join("\n") | gsub("^\\s+|\\s+$"; "")) as $body
                | ({
                    author: ({ name: (.author.name // "unknown") }
                      + (if (.author.username // "") != ""
                         then { url: ("https://github.com/" + .author.username),
                                icon_url: ("https://github.com/" + .author.username + ".png") }
                         else {} end)),
                    title: (($lines[0] // "(no message)") | .[0:256]),
                    url: .url,
                    color: 16096779,
                    footer: { text: ("`" + .id[0:7] + "` · " + $branch) },
                    timestamp: .timestamp
                  } + (if $body == "" then {} else { description: ($body | .[0:400]) } end))
              ]
            }')

          curl -sS -f -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"

  release:
    name: Announce release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Post release announcement
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi

          # Keep the announcement short: first ~900 characters of the notes.
          notes=$(jq -rn --arg b "$RELEASE_BODY" '$b | .[0:900]')
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ "$IS_PRERELEASE" = "true" ]; then
            payload=$(jq -n \
              --arg title "🧪 New Concorde EFB Beta Build: ${RELEASE_NAME:-$RELEASE_TAG}" \
              --arg desc "A new pre-release build is available for testing." \
              --arg url "https://dwaipayanray95.github.io/Concorde-EFB/downloads/" \
              --arg ts "$ts" \
              '{
                embeds: [{
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: 5793266,
                  fields: [{ name: "Download", value: $url }],
                  footer: { text: "Concorde EFB" },
                  timestamp: $ts
                }]
              }')
          else
            payload=$(jq -n \
              --arg title "🚀 ${RELEASE_NAME:-$RELEASE_TAG} is out" \
              --arg notes "$notes" \
              --arg url "$RELEASE_URL" \
              --arg ts "$ts" \
              '{
                embeds: [{
                  title: $title,
                  description: (if $notes == "" then "New release published." else $notes end),
                  url: $url,
                  color: 16096779,
                  fields: [{ name: "Release notes", value: $url }],
                  footer: { text: "Concorde EFB" },
                  timestamp: $ts
                }]
              }')
          fi

          curl -sS -f -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"
