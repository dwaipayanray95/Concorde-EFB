name: Discord

# One master Discord webhook (DISCORD_WEBHOOK_URL secret) for everything
# that happens on GitHub. Runs automatically; nothing to trigger by hand.
#
#  - push to main ............ the new commits (short SHA, subject, author)
#  - release published ....... beta pre-release  -> "New beta build" + downloads page
#                              full release      -> "Concorde EFB vX released" + notes
#
# Full releases from build.yml are created as drafts when "draft" is ticked;
# they only post once someone clicks Publish on GitHub.
#
# If the secret isn't set, every job skips quietly.
on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  commits:
    name: Post pushed commits
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Post commits
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.event.pusher.name }}
          COMPARE_URL: ${{ github.event.compare }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi

          total=$(jq 'length' <<<"$COMMITS")
          if [ "$total" -eq 0 ]; then
            echo "No commits in this push; nothing to post."
            exit 0
          fi

          # Up to 10 commits, one line each: [short sha](link) subject — author
          lines=$(jq -r '.[:10][] | "[`\(.id[0:7])`](\(.url)) \((.message | split("\n")[0]) | .[0:120]) — \(.author.name)"' <<<"$COMMITS")
          more=$(( total > 10 ? total - 10 : 0 ))
          if [ "$more" -gt 0 ]; then
            lines="$lines"$'\n'"…and $more more"
          fi

          payload=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg pusher "$PUSHER" \
            --arg url "$COMPARE_URL" \
            --arg lines "$lines" \
            --argjson total "$total" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: "\($total) new commit\(if $total == 1 then "" else "s" end) on \($branch)",
                url: $url,
                description: $lines,
                color: 16096779,
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Pushed by", value: $pusher, inline: true }
                ],
                footer: { text: "Concorde EFB" },
                timestamp: $ts
              }]
            }')

          curl -sS -f -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"

  release:
    name: Announce release
    runs-on: ubuntu-latest
    steps:
      - name: Post release announcement
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping."
            exit 0
          fi

          # Keep the announcement short: first ~900 characters of the notes.
          notes=$(jq -rn --arg b "$RELEASE_BODY" '$b | .[0:900]')
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ "$IS_PRERELEASE" = "true" ]; then
            payload=$(jq -n \
              --arg title "🧪 New Concorde EFB Beta Build: ${RELEASE_NAME:-$RELEASE_TAG}" \
              --arg desc "A new pre-release build is available for testing." \
              --arg url "https://dwaipayanray95.github.io/Concorde-EFB/downloads/" \
              --arg ts "$ts" \
              '{
                embeds: [{
                  title: $title,
                  description: $desc,
                  url: $url,
                  color: 5793266,
                  fields: [{ name: "Download", value: $url }],
                  footer: { text: "Concorde EFB" },
                  timestamp: $ts
                }]
              }')
          else
            payload=$(jq -n \
              --arg title "🚀 ${RELEASE_NAME:-$RELEASE_TAG} is out" \
              --arg notes "$notes" \
              --arg url "$RELEASE_URL" \
              --arg ts "$ts" \
              '{
                embeds: [{
                  title: $title,
                  description: (if $notes == "" then "New release published." else $notes end),
                  url: $url,
                  color: 16096779,
                  fields: [{ name: "Release notes", value: $url }],
                  footer: { text: "Concorde EFB" },
                  timestamp: $ts
                }]
              }')
          fi

          curl -sS -f -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"
