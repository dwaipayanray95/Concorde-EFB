name: 'AI Release Notes'
description: 'Writes user-friendly release notes for the commits between two refs using Gemini, with an offline commit-list fallback.'
inputs:
  gemini-api-key:
    description: 'Google Gemini API key. If empty, the offline template is used.'
    required: false
    default: ''
  base-ref:
    description: 'Tag/commit to diff from. Empty = last 50 commits.'
    required: false
    default: ''
  head-ref:
    description: 'Tag/commit to diff to.'
    required: false
    default: 'HEAD'
  model:
    description: 'Gemini model id.'
    required: false
    default: 'gemini-3.6-flash'
  thinking-level:
    description: 'Gemini thinking level (minimal/low/medium/high).'
    required: false
    default: 'low'
  version:
    description: 'App version these notes are for (e.g. 5.5.2).'
    required: false
    default: ''
  prerelease:
    description: '"true" for a test build, "false" for a public release.'
    required: false
    default: 'false'
  tag:
    description: 'Tag these notes will be published under (used for the compare link).'
    required: false
    default: ''
  output:
    description: 'File to write the notes to.'
    required: false
    default: 'release_notes.md'
runs:
  using: 'composite'
  steps:
    - name: Generate release notes
      run: node "${{ github.action_path }}/generate-release-notes.js"
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_REF: ${{ inputs.head-ref }}
        GEMINI_MODEL: ${{ inputs.model }}
        GEMINI_THINKING_LEVEL: ${{ inputs.thinking-level }}
        APP_VERSION: ${{ inputs.version }}
        IS_PRERELEASE: ${{ inputs.prerelease }}
        RELEASE_TAG: ${{ inputs.tag }}
        NOTES_OUTPUT: ${{ inputs.output }}
        REPO: ${{ github.repository }}
      shell: bash
